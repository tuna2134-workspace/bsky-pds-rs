[package]
name = "bsky-pds-rs"
version = "0.1.0"
edition = "2021"
authors = ["tuna2134 <hello@tuna2134.dev>"]
description = "Bluesky PDS (Personal Data Server) compatible implementation in Rust + Cloudflare Workers (D1+R2, OAuth)"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = { version = "0.8", features = ["http", "axum", "d1"] }
worker-macros = { version = "0.8", features = ["http"] }
axum = { version = "0.8", default-features = false, features = ["json", "query", "form", "macros"] }
tower-service = "0.3.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
base32 = "0.4"
sha2 = "0.10"
hex = "0.4"
bs58 = "0.5"
uuid = { version = "1.6", features = ["v4", "js"] }
getrandom = { version = "0.2", features = ["js"] }
k256 = { version = "0.13", features = ["ecdsa"] }
p256 = { version = "0.13", features = ["ecdsa"] }
ecdsa = "0.16"

[dev-dependencies]
serde_json = "1.0"
